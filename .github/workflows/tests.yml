name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # Self-sufficient on purpose: this must not depend on #34 landing first.
      # Once requirements-dev.txt exists, collapse this to `-r requirements-dev.txt`.
      - run: pip install -r requirements.txt "pytest>=8.0"
      - name: unit tests
        # Vision tests importorskip torch, which is not installed here on purpose:
        # the ML stack is a few hundred MB and GPS navigation does not need it.
        run: PYTHONPATH=. pytest tests/ -q

  end-to-end:
    # The unit tests mock the backend. This drives the REAL HTTP client against the
    # fake SDK server, which is where integration breakage actually shows up —
    # exactly the class of bug (#29) that passed every unit test.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: follower completes a mission over HTTP
        run: |
          python fake_sdk_server.py 8777 &
          sleep 2
          SDK_BASE_URL=http://localhost:8777 timeout 300 python waypoint_follower.py \
            | tee /tmp/run.log
          grep -q "COMPLETE — 3/3 waypoints" /tmp/run.log
      - name: follower survives an unreliable link
        # Stochastic by construction: which requests get dropped decides how long the
        # run takes, and a shared runner can be slow. Give it a generous budget and one
        # retry, so a red here means "the follower cannot cope", not "the runner was
        # busy". The non-negotiable part is that it never crashes and always stops the
        # rover — a crash fails the step immediately, before any retry.
        run: |
          for attempt in 1 2; do
            port=$((8778 + attempt))
            FAKE_FAIL_RATE=0.3 python fake_sdk_server.py $port &
            server=$!
            sleep 2
            SDK_BASE_URL=http://localhost:$port MAX_RUNTIME_S=240 \
              timeout 300 python waypoint_follower.py | tee /tmp/flaky.log
            kill $server 2>/dev/null || true
            grep -q "Traceback" /tmp/flaky.log && { echo "crashed"; exit 1; }
            grep -q "COMPLETE — 3/3 waypoints" /tmp/flaky.log && exit 0
            echo "attempt $attempt did not complete; retrying"
          done
          exit 1
